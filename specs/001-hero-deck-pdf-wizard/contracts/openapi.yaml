openapi: 3.1.0

# Contract for the local HTTP API. Per constitution Principle II this document is
# generated from / verified against the running service — the contract test in
# tests/contract/ fails if the live schema and this file disagree, so this file is
# never hand-maintained in isolation.
#
# PDF generation is a POST'd resource with its own identity, not a side effect of
# rendering a page. That is what makes the whole product drivable headlessly, and
# therefore MCP-wrappable, with no new application logic.

info:
  title: Marchamp Proxy Builder — Local API
  version: 0.1.0
  description: |
    Local-only service. Binds to 127.0.0.1 and is never publicly reachable (FR-0A1,
    FR-0A2). No authentication exists, because there is no remote access to
    authenticate (FR-0A3). Makes no outbound network calls — card images are read
    from a local directory (FR-019, FR-019a).

servers:
  - url: http://127.0.0.1:8765
    description: Loopback only. Binding to 0.0.0.0 is a defect, not a configuration option.

tags:
  - name: catalog
  - name: decks
  - name: generations
  - name: calibration

paths:
  /api/health:
    get:
      tags: [catalog]
      summary: Liveness plus catalog state
      operationId: getHealth
      responses:
        "200":
          description: Service is running. Catalog may still be invalid — check the payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/catalog/validation:
    get:
      tags: [catalog]
      summary: Full catalog validation report
      description: |
        Reports every problem at once rather than stopping at the first (FR-005d), so a
        user fixing a catalog sees the whole list in one pass.
      operationId: getCatalogValidation
      responses:
        "200":
          description: "Report. `valid: false` is a normal 200 — the request succeeded."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationReport" }

  /api/decks:
    get:
      tags: [decks]
      summary: List selectable hero decks
      operationId: listDecks
      responses:
        "200":
          description: Decks from the catalog, never hard-coded (FR-001).
          content:
            application/json:
              schema:
                type: object
                required: [decks, catalog_revision]
                properties:
                  catalog_revision: { type: string }
                  decks:
                    type: array
                    items: { $ref: "#/components/schemas/DeckSummary" }
        "503":
          description: Catalog is invalid; nothing can be listed.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/decks/{deckId}:
    get:
      tags: [decks]
      summary: Resolved deck contents
      description: The ordered card list with quantities, as it will be printed (FR-005).
      operationId: getDeck
      parameters:
        - $ref: "#/components/parameters/DeckId"
      responses:
        "200":
          description: Resolved deck.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeckDetail" }
        "404":
          description: No such deck.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/generations:
    post:
      tags: [generations]
      summary: Start a generation
      description: |
        Creates a generation resource and returns immediately. The catalog revision is
        captured at creation, so editing the catalog mid-run cannot produce a document
        built from a mixture of revisions.
      operationId: createGeneration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerationRequest" }
      responses:
        "202":
          description: Accepted. Poll the resource for status.
          headers:
            Location:
              schema: { type: string }
              description: URL of the created generation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Generation" }
        "404":
          description: No such deck.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Request understood but unusable — e.g. an unsupported page size.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/generations/{generationId}:
    get:
      tags: [generations]
      summary: Generation status
      operationId: getGeneration
      parameters:
        - $ref: "#/components/parameters/GenerationId"
      responses:
        "200":
          description: |
            Current state. On `failed`, `failure` names the specific card or condition —
            never a generic error (FR-020, FR-021).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Generation" }
        "404":
          description: No such generation.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/generations/{generationId}/document:
    get:
      tags: [generations]
      summary: Download the PDF
      description: |
        Available only when status is `succeeded`. A failed or in-flight generation has no
        document — there is deliberately no partial download (FR-020).
      operationId: getGenerationDocument
      parameters:
        - $ref: "#/components/parameters/GenerationId"
      responses:
        "200":
          description: |
            The PDF. Content-Disposition names the deck, fit mode, and page size (FR-008c),
            so sheets printed from different settings stay distinguishable after the
            application closes.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'e.g. attachment; filename="captain-america-CROP-LETTER.pdf"'
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404":
          description: No such generation.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Generation has not succeeded; no document exists.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/generations/{generationId}/pages/{pageNumber}:
    get:
      tags: [generations]
      summary: Preview image of one page
      description: |
        Rasterised from the generated PDF itself, so the preview cannot drift from the
        document (FR-017, SC-005).
      operationId: getGenerationPage
      parameters:
        - $ref: "#/components/parameters/GenerationId"
        - name: pageNumber
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: width
          in: query
          description: Target raster width in pixels. Preview only; never affects the PDF.
          schema: { type: integer, minimum: 200, maximum: 2000, default: 800 }
      responses:
        "200":
          description: Page raster.
          content:
            image/png:
              schema: { type: string, format: binary }
        "404":
          description: No such generation or page.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Generation has not succeeded; nothing to preview.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/calibration:
    get:
      tags: [calibration]
      summary: Single-page print-scale calibration PDF
      description: |
        Ruler plus one card outline at exact target size, for verifying the printer is not
        silently rescaling (User Story 3, FR-023).
      operationId: getCalibrationDocument
      parameters:
        - name: page_size
          in: query
          schema: { $ref: "#/components/schemas/PageSize" }
      responses:
        "200":
          description: Calibration PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }

components:
  parameters:
    DeckId:
      name: deckId
      in: path
      required: true
      schema: { type: string }
    GenerationId:
      name: generationId
      in: path
      required: true
      schema: { type: string }

  schemas:
    PageSize:
      type: string
      enum: [LETTER, A4]
      default: LETTER
      description: Emitted at the user's real paper size so no printer rescaling is needed.

    FitMode:
      type: string
      enum: [CROP, FIT, STRETCH]
      default: CROP
      description: |
        How a card image fills its 63.5 x 88.9 mm slot. Source scans are 2.7% taller in
        proportion than a standard card, so this is the normal case, not an edge case.

          CROP    - fill the slot, trim ~1.16 mm symmetrically from top and bottom.
                    Prints at exact standard size with no backing card visible.
          FIT     - scale to fit inside, preserving proportions. Nothing trimmed;
                    the printed face is 61.8 x 88.9 mm, narrower than the slot.
          STRETCH - scale axes independently to fill exactly. Nothing trimmed, but
                    the image is distorted by 2.7% vertically.

        STRETCH is the only mode permitted to distort, must be explicitly chosen, and is
        never the default (FR-014). Clients offering it MUST label it as distorting.

    Health:
      type: object
      required: [status, catalog_valid]
      properties:
        status: { type: string, enum: [ok] }
        catalog_valid: { type: boolean }
        catalog_revision: { type: [string, "null"] }
        image_directory_configured: { type: boolean }

    ValidationReport:
      type: object
      required: [valid, errors, warnings]
      properties:
        valid: { type: boolean }
        catalog_revision: { type: [string, "null"] }
        errors:
          type: array
          items: { $ref: "#/components/schemas/ValidationIssue" }
        warnings:
          type: array
          description: Non-blocking, e.g. two cards sharing one image file.
          items: { $ref: "#/components/schemas/ValidationIssue" }

    ValidationIssue:
      type: object
      required: [kind, detail]
      properties:
        kind:
          type: string
          enum:
            - schema_invalid
            - duplicate_card_id
            - unknown_card_reference
            - missing_image_file
            - invalid_quantity
            - shared_image_file
            - unsafe_image_path
        detail: { type: string }
        card_id: { type: [string, "null"] }
        deck_id: { type: [string, "null"] }

    DeckSummary:
      type: object
      required: [id, name, card_count]
      properties:
        id: { type: string }
        name: { type: string }
        card_count:
          type: integer
          description: |
            Total faces printed, counting quantities (FR-007) and counting a double-sided
            card as two (FR-012c).

    DeckDetail:
      allOf:
        - $ref: "#/components/schemas/DeckSummary"
        - type: object
          required: [hero_card_id, entries]
          properties:
            hero_card_id: { type: string }
            entries:
              type: array
              items:
                type: object
                required: [card_id, name, quantity, preferred_printing_id, double_sided]
                properties:
                  card_id: { type: string }
                  name: { type: string }
                  quantity: { type: integer, minimum: 1 }
                  double_sided:
                    type: boolean
                    description: When true this entry yields two faces per copy (FR-012a).
                  preferred_printing_id:
                    type: string
                    description: The printing from this deck's own pack (FR-005f).
                  preferred_printing_available:
                    type: boolean
                    description: |
                      False means generation will fall back to another printing of the same
                      card and report a substitution (FR-005g).

    GenerationRequest:
      type: object
      required: [deck_id]
      properties:
        deck_id: { type: string }
        page_size: { $ref: "#/components/schemas/PageSize" }
        fit_mode: { $ref: "#/components/schemas/FitMode" }

    Generation:
      type: object
      required: [id, deck_id, page_size, fit_mode, status, catalog_revision]
      properties:
        id: { type: string }
        deck_id: { type: string }
        page_size: { $ref: "#/components/schemas/PageSize" }
        fit_mode: { $ref: "#/components/schemas/FitMode" }
        catalog_revision: { type: string }
        status:
          type: string
          enum: [pending, running, succeeded, failed]
          description: |
            No `partial` state — a failure yields no document at all (FR-020b).
            Generations live only as long as the process; they are not durable across a
            restart (FR-021b).
        progress:
          type: [number, "null"]
          description: |
            Fraction of the work completed, 0.0-1.0, while `running`. Required because
            FR-0A4 permits a generation to run for up to 120 s, and FR-016a forbids an
            interface that looks frozen for that long.
          minimum: 0
          maximum: 1
        pages_ready:
          type: [integer, "null"]
          description: |
            Preview pages viewable so far. Pages become available progressively rather than
            only when every page is done (FR-016b).
        page_count: { type: [integer, "null"] }
        card_count:
          type: [integer, "null"]
          description: |
            Printed faces, not distinct cards. A double-sided card counts as two
            (FR-012c), so a 40-card deck plus a double-sided hero is 42.
        substitutions:
          type: array
          description: |
            Art stand-ins used because a deck's own pack printing was unavailable
            (FR-005g). MUST be surfaced before the user commits paper (FR-005h) — an
            empty array means every face uses the deck's own pack art.
          items: { $ref: "#/components/schemas/Substitution" }
        failures:
          type: array
          description: |
            Empty unless status is `failed`. Carries EVERY failing card, not just the first
            (FR-020a) — fixing one problem per attempt across repeated runs is the failure
            mode this exists to prevent.
          items: { $ref: "#/components/schemas/Failure" }

    Substitution:
      type: object
      description: |
        One card printed with artwork from a pack other than its deck's own. The card and
        its rules are correct; only the art differs. Not a failure — but never silent.
      required: [card_id, card_name, wanted_printing_id, used_printing_id]
      properties:
        card_id: { type: string }
        card_name: { type: string }
        wanted_printing_id: { type: string }
        wanted_pack:
          type: [string, "null"]
          description: The pack whose art was preferred but unavailable.
        used_printing_id: { type: string }
        used_pack:
          type: [string, "null"]
          description: The pack whose art was printed instead.

    Failure:
      type: object
      required: [kind, retryable, detail]
      properties:
        kind:
          type: string
          enum:
            - catalog_invalid
            - asset_missing
            - asset_unreadable
            - asset_too_small
            - limit_exceeded
            - internal
        retryable:
          type: boolean
          description: |
            True for transient conditions — a locked file, or a cloud-sync placeholder not
            yet materialised on disk. Distinguishing this from permanent is required by
            FR-021.
        detail: { type: string }
        card_id: { type: [string, "null"] }
        card_name:
          type: [string, "null"]
          description: Present whenever the failure concerns one card, so it can be named.

    Problem:
      type: object
      description: RFC 9457 problem detail.
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
