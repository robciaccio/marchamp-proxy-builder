# Merge gate 1: the full test suite must be green.
# Actions pinned to full commit SHAs — tags are mutable (constitution, Supply chain).

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install frozen
        # MUST fail rather than silently update the lockfile (constitution, Supply chain)
        run: uv sync --locked --all-groups

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        # `physical` tests need a printer and a ruler; they can never run here.
        run: uv run pytest -m "not physical"
