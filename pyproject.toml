[project]
name = "marchamp-proxy-builder"
version = "0.1.0"
description = "Local web app that assembles print-ready proxy PDFs for Marvel Champions"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "reportlab>=4.2",
    "pillow>=11.0",
    "pypdfium2>=4.30",
    "pydantic>=2.9",
    # Runtime as of feature 002: the MarvelCDB client. Chosen over urllib because
    # follow_redirects=False and an explicit timeout are its defaults rather than something
    # a subclass has to remember (research R2).
    "httpx>=0.28",
    # Not a choice: FastAPI refuses to start a route declaring UploadFile without it, and
    # FR-026e requires uploads (research R9).
    "python-multipart>=0.0.20",
]

[project.scripts]
marchamp = "marchamp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pypdf>=6.15.0",
    "ruff>=0.8",
    # Reads contracts/openapi.yaml in the contract test. Dev-only on purpose: the service
    # never parses YAML at runtime.
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marchamp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Spec Kit ships these; they are vendored tooling, not this project's code.
extend-exclude = [".specify"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Declared explicitly: inferring first-party from `src` depends on whether the package
# happens to be installed in the environment, which made lint pass locally and fail in CI.
known-first-party = ["marchamp", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a couple of seconds",
    "physical: needs a printer and a ruler; never run in CI",
]
